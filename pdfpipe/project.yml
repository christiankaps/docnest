name: PdfPipe
options:
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    APP_GROUP_IDENTIFIER: group.com.kaps.pdfpipe
    INFOPLIST_KEY_PdfPipeAppGroup: $(APP_GROUP_IDENTIFIER)
targets:
  PdfPipe:
    type: application
    platform: iOS
    sources: [PdfPipe, Shared]
    dependencies:
      - target: PdfPipeShare
    entitlements:
      path: PdfPipe/PdfPipe.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    info:
      path: PdfPipe/Info.plist
      properties:
        CFBundleDisplayName: PdfPipe
        PdfPipeAppGroup: $(APP_GROUP_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF and Images
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.jpeg, public.png]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaps.pdfpipe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [PdfPipeTests, PdfPipeUITests]
  PdfPipeShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaps.pdfpipe.share
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: ShareExtension/PdfPipeShare.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_IDENTIFIER)]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: PdfPipe
        PdfPipeAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: "extensionItems.@count == 1 AND SUBQUERY(extensionItems, $item, $item.attachments.@count == 1 AND SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO 'com.adobe.pdf' OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO 'public.jpeg' OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO 'public.png').@count == 1).@count == 1"
  PdfPipeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PdfPipeTests]
    dependencies:
      - target: PdfPipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaps.pdfpipe.tests
  PdfPipeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PdfPipeUITests]
    dependencies:
      - target: PdfPipe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaps.pdfpipe.uitests
